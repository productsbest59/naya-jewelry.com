<!doctype html><html lang="he" dir="rtl"><head><link rel="icon" href="favicon.ico?v=2" sizes="any"><link rel="icon" type="image/svg+xml" href="favicon.svg?v=2"><link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png?v=2"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Naya - כניסת מנהל</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-head"><img class="brand" src="../logo trans.png" alt="Naya"><a class="button secondary" href="index.html">חזרה לחנות</a></header><main class="login-shell"><form id="loginForm" class="login-card"><h1>כניסה לניהול החנות</h1><label class="field"><span>כתובת מייל</span><input name="email" type="email" autocomplete="username" required></label><label class="field"><span>סיסמה</span><input name="password" type="password" autocomplete="current-password" required></label><button class="button">כניסה</button><div id="loginMessage" class="status"></div></form></main><script type="module">import{signIn,isAdmin,signOut}from'./api-module.js';const form=document.querySelector('#loginForm'),message=document.querySelector('#loginMessage');form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='מתחבר...';message.className='status show';const d=new FormData(form);try{const session=await signIn(d.get('email'),d.get('password'));if(!await isAdmin(session)){signOut();throw new Error('החשבון אינו מוגדר כמנהל החנות')}location.href='naya-products-c8v3r6x1.html'}catch(error){message.textContent=error.message==='Invalid login credentials'?'כתובת המייל או הסיסמה אינם נכונים':error.message;message.className='status show error'}});</script></body></html>
