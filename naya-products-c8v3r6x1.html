<!doctype html><html lang="he" dir="rtl"><head><link rel="icon" href="favicon.ico?v=2" sizes="any"><link rel="icon" type="image/svg+xml" href="favicon.svg?v=2"><link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png?v=2"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Naya - ניהול מוצרים</title><link rel="stylesheet" href="styles.css?v=11"></head><body><header class="site-head"><img class="brand" src="../logo trans.png" alt="Naya"><div class="head-actions"><a class="button secondary" href="index.html">תצוגת החנות</a></div></header><main class="admin-shell"><div class="admin-top"><div><h1>ניהול מוצרים</h1><p>סביבת בדיקה מקומית - אינה משנה את האתר החי</p></div><div class="head-actions"><button id="add" class="button">+ מוצר חדש</button></div></div><div id="status" class="status"></div><div id="list" class="admin-table"></div></main>
<div id="modal" class="modal"><form id="form" class="modal-card"><h2 id="modalTitle">מוצר</h2><input type="hidden" name="id"><div class="form-grid"><label class="field"><span>שם בעברית</span><input name="nameHe" required></label><label class="field"><span>שם באנגלית</span><input name="nameEn" required></label><label class="field full"><span>תיאור המוצר בעברית</span><textarea name="descriptionHe" rows="6" placeholder="תיאור, חומר, מידות ופרטים נוספים"></textarea></label><label class="field full"><span>תיאור המוצר באנגלית</span><textarea name="descriptionEn" rows="6" placeholder="Product description, materials and measurements"></textarea></label><label class="field"><span>מק״ט</span><input name="sku" required></label><label class="field"><span>קטגוריה</span><select name="category"><option value="necklaces">שרשראות</option><option value="rings">טבעות</option><option value="bracelets">צמידים</option><option value="other">אחר</option></select></label><label class="field"><span>מחיר</span><input name="regularPrice" type="number" min="0" step="0.01" required></label><label class="field"><span>מחיר מבצע - אופציונלי</span><input name="price" type="number" min="0" step="0.01" placeholder="להשאיר ריק כשאין מבצע"></label><label class="field"><span>צבעים</span><textarea name="colors" rows="3" placeholder="זהב&#10;כסף"></textarea><small>אפשרות אחת בכל שורה, או הפרדה בפסיק</small></label><label class="field"><span>מידות</span><textarea name="sizes" rows="3" placeholder="6&#10;7&#10;8"></textarea><small>מידה אחת בכל שורה, או הפרדה בפסיק</small></label><label class="field full"><span>אפשרויות נוספות - אורך או סגנון</span><textarea name="styles" rows="3" placeholder="קצרה&#10;ארוכה"></textarea><small>אפשרות אחת בכל שורה, או הפרדה בפסיק</small></label><label class="field full upload-field"><span>תמונה ראשית של המוצר</span><input id="primaryImageFile" type="file" accept="image/*"><small>תמונה זו תופיע בכרטיס המוצר ובעגלה</small></label><div id="primaryImagePreview" class="image-preview field full"></div><label class="field full upload-field"><span>תמונות נוספות</span><input id="additionalImageFiles" type="file" accept="image/*" multiple><small>התמונות יופיעו בגלריית המוצר</small></label><div id="additionalImagesPreview" class="image-preview field full"></div><div class="field full checks"><label><input name="active" type="checkbox"> מוצר מוצג בחנות</label></div></div><div class="modal-actions"><button type="button" id="cancel" class="button secondary">ביטול</button><button class="button">שמירה</button></div></form></div><script src="catalog.js"></script><script src="admin.js?v=13"></script></body></html>
